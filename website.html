function showToast(msg = "Download start in files") {
  const toast = document.getElementById("toastContainer");
  const msgEl = document.getElementById("toastMessage");
  if (!toast) return;
  if (msgEl) msgEl.innerText = msg;
  toast.classList.remove("opacity-0", "-translate-y-4");
  toast.classList.add("opacity-100", "translate-y-0");
  setTimeout(() => {
    toast.classList.remove("opacity-100", "translate-y-0");
    toast.classList.add("opacity-0", "-translate-y-4");
  }, 3000);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
}

function getAnyUrl(obj) {
  if (!obj) return "";
  if (typeof obj === "string") return obj;
  return obj.watchUrl || obj.link || obj.url || obj.videoUrl || obj.downloadUrl || obj.file || obj.source || obj.mediaUrl || obj.video || obj.mp4 || obj.src || obj.streamUrl || obj.epUrl || "";
}

function getTrailerUrl(obj) {
  if (!obj) return "";
  return obj.trailerUrl || obj.trailer || obj.previewUrl || obj.teaserUrl || getAnyUrl(obj);
}

function getAvailableLanguages(targetNode) {
  if (!targetNode) return ["Hindi"];
  let langs = [];

  if (targetNode.languages && typeof targetNode.languages === "object" && !Array.isArray(targetNode.languages)) {
    Object.keys(targetNode.languages).forEach(l => {
      if (l && targetNode.languages[l]) langs.push(String(l));
    });
  }

  if (langs.length === 0) {
    const standardLangs = ["Hindi", "English", "Japanese", "Tamil", "Telugu", "Korean", "Spanish", "Default"];
    standardLangs.forEach(sl => {
      if (targetNode[sl.toLowerCase()] || targetNode[sl]) {
        langs.push(sl);
      }
    });
  }

  if (langs.length === 0) {
    langs.push("Hindi");
  }

  return Array.from(new Set(langs));
}

function getAvailableQualitiesData(targetNode, language = "") {
  const standardOrder = ["360p", "480p", "720p", "1080p", "4K"];
  let available = {};

  if (!targetNode) return available;
  let nodeToCheck = targetNode;

  if (targetNode.languages && typeof targetNode.languages === "object") {
    let matchedLangKey = Object.keys(targetNode.languages).find(k => k.toLowerCase() === (language || "").toLowerCase());
    if (!matchedLangKey && Object.keys(targetNode.languages).length > 0) {
      matchedLangKey = Object.keys(targetNode.languages)[0]; 
    }
    if (matchedLangKey && targetNode.languages[matchedLangKey]) {
      nodeToCheck = targetNode.languages[matchedLangKey];
    }
  } else if (language && targetNode[language.toLowerCase()]) {
    nodeToCheck = targetNode[language.toLowerCase()];
  }

  let qObj = nodeToCheck.qualities || nodeToCheck.qualityMap || nodeToCheck.resolutions;
  if (!qObj && (nodeToCheck["720p"] || nodeToCheck["1080p"] || nodeToCheck["360p"] || nodeToCheck["480p"] || nodeToCheck["4K"])) {
    qObj = nodeToCheck;
  }

  if (qObj && typeof qObj === "object") {
    for (let key of standardOrder) {
      let val = getAnyUrl(qObj[key] || qObj[key.toLowerCase()] || qObj[key.toUpperCase()]);
      if (val && typeof val === "string" && val.trim().length > 5) {
        available[key] = val.trim();
      }
    }
  }

  if (Object.keys(available).length === 0) {
    let directUrl = getAnyUrl(nodeToCheck);
    if (directUrl && directUrl.trim().length > 5) {
      available["1080p"] = directUrl.trim(); 
    } else {
      let rootUrl = getAnyUrl(targetNode);
      if (rootUrl && rootUrl.trim().length > 5) {
        available["1080p"] = rootUrl.trim();
      }
    }
  }

  return available;
}

function resolveVideoUrl(targetNode, quality, language) {
  let qMap = getAvailableQualitiesData(targetNode, language);
  if (qMap[quality]) return qMap[quality];
  let keys = Object.keys(qMap);
  if (keys.length > 0) {
    return qMap[keys[0]]; 
  }
  return getAnyUrl(targetNode);
}

function findItemUniversal(id, type) {
  if (!id) return null;
  if (type === 'series') {
    if (webseries[id]) return { id, type: 'series', ...webseries[id] };
    for (const pKey in platforms) {
      const p = platforms[pKey];
      if (p && p.series && p.series[id]) {
        return { id, type: 'series', ...p.series[id] };
      }
    }
    for (const sKey in webseries) {
      if (sKey === id || webseries[sKey]?.id === id) return { id: sKey, type: 'series', ...webseries[sKey] };
    }
    for (const pKey in platforms) {
      const p = platforms[pKey];
      if (p && p.series) {
        for (const sKey in p.series) {
          if (sKey === id || p.series[sKey]?.id === id) return { id: sKey, type: 'series', ...p.series[sKey] };
        }
      }
    }
  } else {
    if (movies[id]) return { id, type: 'movie', ...movies[id] };
    for (const pKey in platforms) {
      const p = platforms[pKey];
      if (p) {
        if (p.movies && p.movies[id]) return { id, type: 'movie', ...p.movies[id] };
        if (p.anime && p.anime[id]) return { id, type: 'movie', ...p.anime[id] };
      }
    }
    for (const mKey in movies) {
      if (mKey === id || movies[mKey]?.id === id) return { id: mKey, type: 'movie', ...movies[mKey] };
    }
    for (const pKey in platforms) {
      const p = platforms[pKey];
      if (p) {
        ['movies', 'anime'].forEach(cat => {
          if (p[cat]) {
            for (const subKey in p[cat]) {
              if (subKey === id || p[cat][subKey]?.id === id) return { id: subKey, type: 'movie', ...p[cat][subKey] };
            }
          }
        });
      }
    }
  }
  return null;
}

function isAnimeItem(item) {
  if (!item) return false;
  const genre = (item.genre || "").toLowerCase();
  const category = (item.category || "").toLowerCase();
  const title = (item.title || item.name || "").toLowerCase();
  const typeField = (item.type || "").toLowerCase();

  const liveActionBlacklist = [
    "dhurandhar", "dhaurander", "money heist", "pathaan", "jawan", "animal", 
    "stranger things", "mirzapur", "farzi", "panchayat", "asuran", "kgf", "pushpa"
  ];
  for (let kw of liveActionBlacklist) {
    if (title.includes(kw)) return false;
  }

  const animeKeywords = [
    "suzume", "solo leveling", "your name", "demon slayer", "jujutsu kaisen", 
    "naruto", "one piece", "attack on titan", "dragon ball", "bleach", "tokyo ghoul"
  ];
  for (let akw of animeKeywords) {
    if (title.includes(akw)) return true;
  }

  return genre.includes("anime") || genre.includes("animation") || category.includes("anime") || typeField.includes("anime");
}

function movieArray() {
  let list = Object.entries(movies || {}).map(([id, movie]) => ({ id: id || "movie_" + Math.random(), type: "movie", ...(movie || {}) }));
  Object.values(platforms || {}).forEach(p => {
    if (p && p.movies) {
      Object.entries(p.movies).forEach(([id, m]) => {
        if (!list.some(x => x.id === id)) list.push({ id, type: 'movie', ...(m || {}) });
      });
    }
  });
  return list;
}

function webseriesArray() {
  let list = Object.entries(webseries || {}).map(([id, series]) => ({ id: id || "series_" + Math.random(), type: "series", ...(series || {}) }));
  Object.values(platforms || {}).forEach(p => {
    if (p && p.series) {
      Object.entries(p.series).forEach(([id, s]) => {
        if (!list.some(x => x.id === id)) list.push({ id, type: 'series', ...(s || {}) });
      });
    }
  });
  Object.values(platforms || {}).forEach(p => {
    if (p && p.anime) {
      Object.entries(p.anime).forEach(([id, a]) => {
        if (!list.some(x => x.id === id)) list.push({ id, type: a.seasons ? 'series' : 'movie', ...(a || {}) });
      });
    }
  });
  return list;
}

function nonAnimeMoviesArray() { return movieArray().filter(m => !isAnimeItem(m)); }
function nonAnimeWebseriesArray() { return webseriesArray().filter(s => !isAnimeItem(s)); }
function animeMoviesArray() { return movieArray().filter(m => isAnimeItem(m)); }
function animeWebseriesArray() { return webseriesArray().filter(s => isAnimeItem(s)); }
function categoryArray() { return Object.entries(categories || {}).map(([id, cat]) => ({ id: id, ...(cat || {}) })); }
function platformArray() { return Object.entries(platforms || {}).map(([id, p]) => ({ id: id, ...(p || {}) })); }

function bannerArray() {
  let list = [];
  if (banners && typeof banners === "object") {
    list = Object.entries(banners).map(([id, b]) => {
      if (!b) return null;
      let poster = b.imageUrl || b.posterUrl || b.bannerUrl || "";
      return { id: id, title: b.title || b.name || "Featured", posterUrl: poster, ...b };
    }).filter(item => item && item.posterUrl);
  }
  if (list.length === 0) {
    let extra = [...nonAnimeMoviesArray(), ...nonAnimeWebseriesArray()];
    let existingIds = new Set(list.map(l => l.id));
    extra.forEach(item => {
      if (!existingIds.has(item.id)) {
        list.push(item);
        existingIds.add(item.id);
      }
    });
  }
  return list;
}

window.setPlayerQuality = function(quality) {
  selectedQuality = quality;
  isQualityMenuOpen = false;
  isLanguageMenuOpen = false;
  showToast(`Quality switched to ${quality}`);

  let targetNode = null;
  if (selectedEpisode.type === 'series') {
    const series = findItemUniversal(selectedEpisode.id, 'series');
    if (series && series.seasons && series.seasons[selectedEpisode.seasonName]) {
      const eps = series.seasons[selectedEpisode.seasonName].episodes || {};
      const epValues = Object.values(eps);
      targetNode = epValues[selectedEpisode.episodeNumber - 1];
    }
  } else {
    targetNode = findItemUniversal(selectedEpisode.id, 'movie');
  }

  if (targetNode) {
    selectedEpisode.videoUrl = resolveVideoUrl(targetNode, selectedQuality, selectedLanguage);
  }

  render();
};

window.toggleQualityMenu = function() {
  let targetNode = null;
  if (selectedEpisode.type === 'series') {
    const series = findItemUniversal(selectedEpisode.id, 'series');
    if (series && series.seasons && series.seasons[selectedEpisode.seasonName]) {
      const eps = series.seasons[selectedEpisode.seasonName].episodes || {};
      const epValues = Object.values(eps);
      targetNode = epValues[selectedEpisode.episodeNumber - 1];
    }
  } else {
    targetNode = findItemUniversal(selectedEpisode.id, 'movie');
  }

  const qMap = getAvailableQualitiesData(targetNode, selectedLanguage);
  const qKeys = Object.keys(qMap);

  if (qKeys.length <= 1) {
    showToast(`Current Quality: ${qKeys[0] || selectedQuality || '1080p'}`);
    return;
  }

  isQualityMenuOpen = !isQualityMenuOpen;
  isLanguageMenuOpen = false;
  render();
};

window.setPlayerLanguage = function(lang) {

  let targetNode = null;
  if (selectedEpisode.type === 'series') {
    const series = findItemUniversal(selectedEpisode.id, 'series');
    if (series && series.seasons && series.seasons[selectedEpisode.seasonName]) {
      const eps = series.seasons[selectedEpisode.seasonName].episodes || {};
      const epValues = Object.values(eps);
      targetNode = epValues[selectedEpisode.episodeNumber - 1];
    }
  } else {
    targetNode = findItemUniversal(selectedEpisode.id, 'movie');
  }

  if (targetNode) {

    }
  }

  render();
};

function getSearchResultsHTML(query) {
  const q = query.toLowerCase().trim();
  const allItems = [...nonAnimeMoviesArray(), ...nonAnimeWebseriesArray(), ...animeMoviesArray(), ...animeWebseriesArray()];
  const filtered = q === "" ? allItems : allItems.filter(item => (item.title || item.name || "").toLowerCase().includes(q));
  
  if (filtered.length === 0) {
    return `<div class="text-center py-10 text-xs text-slate-500">No results found for "${esc(query)}"</div>`;
  }
  
  return `
    <div class="mb-3 flex items-center justify-between text-[11px] text-slate-400">
      <span>${filtered.length} results found</span>
    </div>
    <div class="grid grid-cols-2 gap-3">
      ${filtered.map(item => `
        <div onclick="window.openDetail('${esc(item.id)}', '${esc(item.type || 'movie')}');" class="bg-slate-900 rounded-xl p-2 cursor-pointer border border-white/5 relative">
          <img src="${esc(item.posterUrl || item.imageUrl)}" class="w-full aspect-[2/3] object-cover rounded-lg mb-2">
          <h3 class="text-xs font-bold truncate">${esc(item.title || item.name)}</h3>
        </div>
      `).join('')}
    </div>
  `;
}

window.openDetail = function(id, type) {
  if (detailAutoPlayTimer) clearTimeout(detailAutoPlayTimer);
  isPlaybackSettingsOpen = false;
  isWatchSeasonDropdownOpen = false;
  isQualityMenuOpen = false;
  isLanguageMenuOpen = false;
  
  let item = findItemUniversal(id, type);
  if (!item) {
    item = findItemUniversal(id, type === 'series' ? 'movie' : 'series');
  }

  if (item) {
    if (item.type === 'series') {
      currentSeriesId = item.id; currentMovieId = null;
      if (item.seasons) {
        const sKeys = Object.keys(item.seasons);
        selectedSeasonKey = sKeys[0] || null;
      }
    } else {
      currentMovieId = item.id; currentSeriesId = null;
    }
  } else {
    if (type === 'series') { currentSeriesId = id; currentMovieId = null; }
    else { currentMovieId = id; currentSeriesId = null; }
  }

  currentPage = "detail";
  window.scrollTo(0, 0);
  render();

  detailAutoPlayTimer = setTimeout(() => {
    const posterBox = document.getElementById("detailPosterBox");
    const videoBox = document.getElementById("detailVideoBox");
    const videoEl = document.getElementById("detailTrailerPlayer");
    const soundBtn = document.getElementById("trailerSoundBtn");
    const badgeEl = document.getElementById("trailerBadge");

    if (posterBox && videoBox && videoEl) {
      posterBox.classList.add("hidden");
      videoBox.classList.remove("hidden");
      if (badgeEl) badgeEl.classList.remove("hidden");
      
      videoEl.muted = false;
      videoEl.play().then(() => {
        if (soundBtn) soundBtn.classList.add("hidden");
      }).catch(() => {
        videoEl.muted = true;
        videoEl.play().then(() => {
          if (soundBtn) soundBtn.classList.remove("hidden");
        }).catch(() => {});
      });
    }
  }, 3000);
};

window.unmuteTrailer = function() {
  const videoEl = document.getElementById("detailTrailerPlayer");
  const soundBtn = document.getElementById("trailerSoundBtn");
  if (videoEl) {
    videoEl.muted = false;
    videoEl.play().catch(() => {});
    if (soundBtn) soundBtn.classList.add("hidden");
  }
};

window.toggleSaveItem = function(id, type, title, posterUrl) {
  const index = savedItems.findIndex(i => i.id === id);
  if (index > -1) { savedItems.splice(index, 1); } 
  else { savedItems.push({ id, type, title, posterUrl }); }
  localStorage.setItem("xeon_saved_items", JSON.stringify(savedItems));
  render();
};

window.toggleLikeItem = function(id, type, title, posterUrl) {

  else { likedItems.push({ id, type, title, posterUrl }); }
  localStorage.setItem("xeon_liked_items", JSON.stringify(likedItems));
  render();
};

window.handleDownload = function(id, type, title, posterUrl, videoUrl) {
  if (!videoUrl) {
    showToast("Download link not available!");
    return;
  }
  const a = document.createElement('a');
  a.href = videoUrl;
  a.download = title || 'video';
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  if (!downloadedItems.some(i => i.id === id && i.title === title)) {
    downloadedItems.push({ id, type, title, posterUrl, videoUrl });
    localStorage.setItem("xeon_downloaded_items", JSON.stringify(downloadedItems));
  }
  showToast("Download start in files, check notification");
  render();
};

window.removeDownloadItem = function(id, title) {
  downloadedItems = downloadedItems.filter(i => !(i.id === id && i.title === title));
  localStorage.setItem("xeon_downloaded_items", JSON.stringify(downloadedItems));
  render();
};

window.clearAllDownloads = function() {
  if (confirm("Are you sure you want to remove all downloaded videos?")) {
    downloadedItems = [];
    localStorage.removeItem("xeon_downloaded_items");
    render();
  }
};

window.selectSeason = function(sKey) { selectedSeasonKey = sKey; render(); };

window.selectWatchSeason = function(sKey) {
  selectedEpisode.seasonName = sKey;
  isWatchSeasonDropdownOpen = false;
  
  const series = findItemUniversal(selectedEpisode.id, 'series');
  if (series && series.seasons && series.seasons[sKey] && series.seasons[sKey].episodes) {
    const epEntries = Object.entries(series.seasons[sKey].episodes);
    if (epEntries.length > 0) {
      const [firstKey, firstEp] = epEntries[0];
      const langs = getAvailableLanguages(firstEp);
      selectedLanguage = langs[0] || "Hindi";
      
      const qMap = getAvailableQualitiesData(firstEp, selectedLanguage);
      const qKeys = Object.keys(qMap);
      if (qKeys.length > 0) {
        selectedQuality = qKeys[qKeys.length - 1]; 
        selectedEpisode.videoUrl = qMap[selectedQuality];
      } else {
        selectedEpisode.videoUrl = getAnyUrl(firstEp);
      }
      selectedEpisode.title = firstEp.title || "Episode 1";
      selectedEpisode.episodeNumber = 1;
    }
  }
  render();
};

window.toggleWatchSeasonDropdown = function() {
  isWatchSeasonDropdownOpen = !isWatchSeasonDropdownOpen;
  render();
};

window.toggleVideoFullscreen = function() {
  const videoEl = document.getElementById("mainVideoPlayer");
  if (!videoEl) return;
  if (videoEl.requestFullscreen) { videoEl.requestFullscreen(); } 
  else if (videoEl.webkitRequestFullscreen) { videoEl.webkitRequestFullscreen(); } 
  else if (videoEl.msRequestFullscreen) { videoEl.msRequestFullscreen(); }
};

window.playSpecificEpisode = function(epNodeOrUrl, epTitle, seasonName, epNum) {
  let targetNode = epNodeOrUrl;
  const langs = getAvailableLanguages(targetNode);
  selectedLanguage = langs[0] || "Hindi";

  const qMap = getAvailableQualitiesData(targetNode, selectedLanguage);
  const qKeys = Object.keys(qMap);
  if (qKeys.length > 0) {
    selectedQuality = qKeys[qKeys.length - 1];
    selectedEpisode.videoUrl = qMap[selectedQuality];
  } else {
    selectedEpisode.videoUrl = getAnyUrl(targetNode);
  }

  selectedEpisode.title = epTitle;
  selectedEpisode.seasonName = seasonName;
  selectedEpisode.episodeNumber = epNum;
  window.scrollTo(0, 0);
  render();
  setTimeout(() => {
    const vPlayer = document.getElementById("mainVideoPlayer");
    if (vPlayer) {
      vPlayer.play().catch(() => {
        vPlayer.muted = true;
        vPlayer.play().catch(() => {});
      });
    }
  }, 100);
};

window.playNextEpisode = function() {
  if (selectedEpisode.type !== 'series') return;
  const series = findItemUniversal(selectedEpisode.id, 'series');
  if (!series || !series.seasons || !series.seasons[selectedEpisode.seasonName]) return;
  
  const episodesObj = series.seasons[selectedEpisode.seasonName].episodes || {};
  const epEntries = Object.entries(episodesObj);
  const nextIndex = selectedEpisode.episodeNumber; 
  
  if (nextIndex < epEntries.length) {
    const [nextKey, nextEp] = epEntries[nextIndex];
    window.playSpecificEpisode(nextEp, nextEp.title || `Episode ${nextIndex + 1}`, selectedEpisode.seasonName, nextIndex + 1);
  } else {
    showToast("You have reached the last episode of this season!");
  }
};

window.openWatchScreen = function(id, type, episodeNode = null, epTitle = "", seasonName = "Movie", episodeNumber = 1) {
  if (detailAutoPlayTimer) clearTimeout(detailAutoPlayTimer);
  let mediaObj = findItemUniversal(id, type) || findItemUniversal(id, type === 'series' ? 'movie' : 'series');
  isPlaybackSettingsOpen = false;
  isWatchSeasonDropdownOpen = false;
  isQualityMenuOpen = false;
  isLanguageMenuOpen = false;

  let targetNode = episodeNode;

  if (type === "series" || (mediaObj && mediaObj.type === 'series') || (mediaObj && mediaObj.seasons)) {
    currentSeriesId = id; currentMovieId = null;
    let targetTitle = epTitle, targetSeason = seasonName, targetEpNum = episodeNumber;
    if (mediaObj && mediaObj.seasons) {
      const sKeys = Object.keys(mediaObj.seasons);
      if (!selectedSeasonKey || !mediaObj.seasons[selectedSeasonKey]) {
        selectedSeasonKey = sKeys[0] || "season_1";
      }
      targetSeason = selectedSeasonKey;
      if (!targetNode) {
        const activeSeason = mediaObj.seasons[targetSeason];
        if (activeSeason && activeSeason.episodes) {
          const epEntries = Object.entries(activeSeason.episodes);
          const [firstEpKey, firstEp] = epEntries[0] || [];
          if (firstEp) {
            targetNode = firstEp;
            targetTitle = firstEp.title || "Episode 1";
            targetEpNum = 1;
          }
        }
      }
    }

    const checkNode = targetNode || mediaObj;
    const langs = getAvailableLanguages(checkNode);
    selectedLanguage = langs[0] || "Hindi";

    const qMap = getAvailableQualitiesData(checkNode, selectedLanguage);
    const qKeys = Object.keys(qMap);
    if (qKeys.length > 0) {
      selectedQuality = qKeys[qKeys.length - 1]; 
    } else {
      selectedQuality = "1080p";
    }

    selectedEpisode = { 
      id: id, type: 'series', 
      title: targetTitle || (mediaObj ? mediaObj.title : "Episode 1"), 
      episodeNumber: targetEpNum, 
      seasonName: targetSeason, 
      videoUrl: resolveVideoUrl(checkNode, selectedQuality, selectedLanguage), 
      posterUrl: mediaObj?.posterUrl || mediaObj?.imageUrl || '',
      rating: mediaObj?.rating || '6.5',
      year: mediaObj?.year || '2019'
    };
  } else {
    currentMovieId = id; currentSeriesId = null;
    let movieNode = targetNode || mediaObj;

    const langs = getAvailableLanguages(movieNode);
    selectedLanguage = langs[0] || "Hindi";

    const qMap = getAvailableQualitiesData(movieNode, selectedLanguage);
    const qKeys = Object.keys(qMap);
    if (qKeys.length > 0) {
      selectedQuality = qKeys[qKeys.length - 1];
    } else {
      selectedQuality = "1080p";
    }

    selectedEpisode = { 
      id: id, type: 'movie', 
      title: mediaObj ? (mediaObj.title || mediaObj.name) : "Movie", 
      episodeNumber: 1, 
      seasonName: "Movie", 
      videoUrl: resolveVideoUrl(movieNode, selectedQuality, selectedLanguage), 
      posterUrl: mediaObj?.posterUrl || mediaObj?.imageUrl || '',
      rating: mediaObj?.rating || '6.5',
      year: mediaObj?.year || '2019'
    };
  }

  if (mediaObj) {
    const historyItem = { id: id, type: type, title: mediaObj.title || mediaObj.name, posterUrl: mediaObj.posterUrl || mediaObj.imageUrl };
    watchHistory = [historyItem, ...watchHistory.filter(h => h.id !== id)].slice(0, 20);
    localStorage.setItem("xeon_watch_history", JSON.stringify(watchHistory));
  }

  currentPage = "watch";
  window.scrollTo(0, 0);
  render();

  setTimeout(() => {
    const vPlayer = document.getElementById("mainVideoPlayer");
    if (vPlayer) {
      vPlayer.play().catch(() => {
        vPlayer.muted = true;
        vPlayer.play().catch(() => {});
      });
    }
  }, 100);
};

window.handleTouchStart = function(e) { touchStartX = e.touches[0].clientX; };
window.handleTouchMove = function(e) { touchEndX = e.touches[0].clientX; };
window.handleTouchEnd = function() {
  const bannersList = bannerArray();
  if (bannersList.length <= 1) return;
  const diff = touchStartX - touchEndX;
  if (Math.abs(diff) > 30) {
    if (diff > 0) { heroIndex = (heroIndex + 1) % bannersList.length; } 
    else { heroIndex = (heroIndex - 1 + bannersList.length) % bannersList.length; }
    updateHeroBannerDOM(bannersList);
    startAutoSlide();
  }
};

function updateHeroBannerDOM(bannersList) {
  const container = document.getElementById("heroBannerContainer");
  if (!container) return;
  const banner = bannersList[heroIndex] || bannersList[0];
  if (!banner) return;

  const ratingVal = banner.rating || '6.5';
  const yearVal = banner.year || '2019';
  const safeTitle = banner.title || banner.name || 'Featured';

  container.innerHTML = `
    <div 
      ontouchstart="window.handleTouchStart(event)" 
      ontouchmove="window.handleTouchMove(event)" 
      ontouchend="window.handleTouchEnd(event)"
      class="relative w-full aspect-[16/9] bg-slate-900 overflow-hidden cursor-pointer"
      onclick="window.openBannerAction('${esc(banner.id)}', '${esc(safeTitle)}')"

        <div class="flex items-center gap-2 mb-1.5">

          <span class="text-xs text-amber-400 font-bold"><i class="fa-solid fa-star text-[10px]"></i> ${esc(ratingVal)}</span>
        </div>
        <h2 class="text-xl md:text-3xl font-black text-white mb-3 truncate">${esc(safeTitle)}</h2>
        
        <div class="flex items-center justify-between">
          <button onclick="event.stopPropagation(); window.openBannerAction('${esc(banner.id)}', '${esc(safeTitle)}');" class="bg-gradient-to-r from-cyan-500 to-blue-600 text-white px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider flex items-center gap-2 shadow-lg shadow-cyan-500/30 hover:opacity-95 transition"><i class="fa-solid fa-magnifying-glass text-xs"></i> WATCH NOW</button>

            ${selectedEpisode.type === 'series' ? `
              <button onclick="window.playNextEpisode()" class="bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-400 border border-cyan-500/30 px-3 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1">
                Next Ep <i class="fa-solid fa-forward text-[10px]"></i>
              </button>
            ` : ''}
          </div>
          
          <div class="flex items-center gap-3 mb-3 text-xs flex-wrap">
            <span class="text-amber-400 font-bold flex items-center gap-1"><i class="fa-solid fa-star text-[10px]"></i> ${esc(selectedEpisode.rating)}</span>
            <span class="text-slate-300 font-bold">${esc(selectedEpisode.year)}</span>
            ${selectedEpisode.type === 'series' ? `<span class="text-slate-400">Season ${esc(selectedEpisode.seasonName?.replace('season_', ''))} E${esc(selectedEpisode.episodeNumber)}</span>` : '<span class="text-slate-400">Movie</span>'}
            <span class="text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20 font-bold">Lang: ${esc(selectedLanguage)}</span>
          </div>

          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2 overflow-x-auto pb-1">
              <button onclick="if(navigator.share) { navigator.share({title: '${esc(selectedEpisode.title)}', url: window.location.href}); } else { showToast('Link copied!'); }" class="bg-white/10 hover:bg-white/20 text-white px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 transition whitespace-nowrap">
                <i class="fa-solid fa-share-nodes text-[10px]"></i> Share
              </button>
              <button onclick="window.handleDownload('${esc(selectedEpisode.id)}', '${esc(selectedEpisode.type)}', '${esc(selectedEpisode.title)}', '${esc(selectedEpisode.posterUrl)}', '${esc(selectedEpisode.videoUrl)}')" class="bg-white/10 hover:bg-white/20 text-white px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 transition whitespace-nowrap">
                <i class="fa-solid fa-download text-[10px]"></i> Download
              </button>
              <button onclick="window.toggleSaveItem('${esc(selectedEpisode.id)}', '${esc(selectedEpisode.type)}', '${esc(selectedEpisode.title)}', '${esc(selectedEpisode.posterUrl)}')" class="${isSaved ? 'bg-cyan-500 text-black' : 'bg-white/10 text-white'} px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 transition whitespace-nowrap">
                <i class="fa-solid ${isSaved ? 'fa-check' : 'fa-bookmark'} text-[10px]"></i> ${isSaved ? 'Saved' : 'Save'}
              </button>
              <button onclick="window.toggleLikeItem('${esc(selectedEpisode.id)}', '${esc(selectedEpisode.type)}', '${esc(selectedEpisode.title)}', '${esc(selectedEpisode.posterUrl)}')" class="${isLiked ? 'bg-cyan-500 text-black' : 'bg-white/10 text-white'} px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 transition whitespace-nowrap">
                <i class="fa-solid ${isLiked ? 'fa-check' : 'fa-heart'} text-[10px]"></i> ${isLiked ? 'Liked' : 'Like'}
              </button>
            </div>

            ${selectedEpisode.type === 'series' && seriesObj && seriesObj.seasons ? `
              <div class="relative">
                <button onclick="window.toggleWatchSeasonDropdown()" class="bg-[#121826] border border-white/10 hover:bg-white/10 text-cyan-400 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 transition whitespace-nowrap">
                  <span>${esc(selectedEpisode.seasonName || 'Season 1')}</span>
                  <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </button>
                ${isWatchSeasonDropdownOpen ? `
                  <div class="absolute right-0 mt-1 bg-[#121826] border border-white/10 rounded-xl shadow-2xl py-1 z-50 min-w-[120px]">
                    ${Object.keys(seriesObj.seasons).map(sKey => `
                      <div onclick="window.selectWatchSeason('${esc(sKey)}')" class="px-4 py-2 text-xs text-white hover:bg-white/10 cursor-pointer transition ${selectedEpisode.seasonName === sKey ? 'text-cyan-400 font-bold bg-white/5' : ''}">
                        ${esc(sKey)}
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            ` : ''}
          </div>

          ${selectedEpisode.type === 'series' && seriesObj && seriesObj.seasons ? `
            <div class="mb-4">
              <div class="flex gap-2 overflow-x-auto pb-2">
                ${(() => {
                  let activeSeason = seriesObj.seasons[selectedEpisode.seasonName] || Object.values(seriesObj.seasons)[0];
                  if (!activeSeason || !activeSeason.episodes) return '<p class="text-xs text-slate-500">No episodes found</p>';
                  return Object.entries(activeSeason.episodes).map(([epKey, ep], idx) => {
                    let epTitle = ep.title || `Episode ${idx + 1}`;
                    let isCurrentEp = selectedEpisode.episodeNumber === (idx + 1);
                    return `
                      <button onclick="window.playSpecificEpisode(${JSON.stringify(ep).replace(/"/g, '&quot;')}, '${esc(epTitle)}', '${esc(selectedEpisode.seasonName)}', ${idx + 1})" class="w-12 h-12 rounded-xl flex items-center justify-center font-bold text-xs transition flex-shrink-0 cursor-pointer ${isCurrentEp ? 'bg-cyan-500 text-black shadow-lg shadow-cyan-500/30' : 'bg-[#121826] text-white border border-white/10 hover:bg-white/10'}">
                        ${idx + 1 < 10 ? '0' + (idx + 1) : idx + 1}
                      </button>
                    `;
                  }).join('');
                })()}
              </div>
            </div>
          ` : ''}

          <div class="mt-6">
            <h2 class="text-xs font-bold text-cyan-400 tracking-wider mb-3 flex items-center gap-1.5">
              <i class="fa-solid fa-fire text-xs"></i> You May Also Like
            </h2>
            <div class="grid grid-cols-2 gap-3">
              ${allOtherItems.length > 0 ? allOtherItems.slice(0, 4).map(oth => `
                <div onclick="window.openDetail('${esc(oth.id)}', '${esc(oth.type || 'movie')}');" class="bg-slate-900 rounded-xl p-2 cursor-pointer border border-white/5">
                  <img src="${esc(oth.posterUrl || oth.imageUrl)}" class="w-full aspect-[2/3] object-cover rounded-lg mb-2">
                  <h3 class="text-xs font-bold truncate">${esc(oth.title || oth.name)}</h3>
                </div>
              `).join('') : '<p class="text-xs text-slate-500">No recommendations found.</p>'}
            </div>
          </div>
        </div>
      </div>
    `;
  }
}
render();
</script>
</body>
</html>
